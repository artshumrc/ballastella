<!-- The maskable installed-app icon: the same geometry as `src/lib/assets/favicon.svg`, on the
     solid ground a maskable icon needs. Placeholder — real identity work replaces it.

     ⚠ One of four copies of this shape; see the note in `src/lib/assets/favicon.svg`.

     No media query here, and that is deliberate: an installed app's icon sits on a launcher whose
     background this file knows nothing about, so it carries its own ground and one fixed pair.
     Sidereal's `base-300` from the dark theme, with the dark theme's `accent` on it, so the mark
     holds its own against both a light and a dark launcher. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
	<rect width="32" height="32" fill="#0d121a" />
	<g fill="none" stroke="#45bdb3" stroke-width="2.5" stroke-linecap="round">
		<path d="M5 27 L23 9" />
		<path d="M13 11 L23 21" />
	</g>
	<circle cx="26" cy="6" r="2.5" fill="#45bdb3" />
</svg>
