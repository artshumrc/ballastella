<!-- The ballastella: a graduated staff, its sliding crosspiece, and the star being sighted
     (CONTEXT.md). Placeholder geometry — real identity work replaces it.

     ⚠ The same three strokes are drawn in four places and cannot be shared: this file, the viewer's
     copy of it, `static/icons/icon.svg`, and `packages/ui/src/BallastellaMark.svelte`. A favicon and
     an installed-app icon must be standalone files with literal colours, while a mark in the bar has
     to follow the theme, so it is inline and uses `currentColor`. A change to the shape is a change
     to all four.

     The colours are Sidereal's verdigris — `accent` in each theme, from ADR-0036's table — rather
     than a stock teal. A favicon renders in its own document and inherits nothing, so the theme
     cannot reach it and the media query below is the only way a dark browser tab gets the lighter
     half of the pair. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
	<style>
		.mark { stroke: #14625e; fill: #14625e; }
		@media (prefers-color-scheme: dark) {
			.mark { stroke: #45bdb3; fill: #45bdb3; }
		}
	</style>
	<g class="mark" fill="none" stroke-width="2.5" stroke-linecap="round">
		<path d="M5 27 L23 9" />
		<path d="M13 11 L23 21" />
	</g>
	<circle class="mark" cx="26" cy="6" r="2.5" stroke="none" />
</svg>
