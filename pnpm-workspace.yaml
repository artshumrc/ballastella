packages:
  - packages/*
  - apps/*

# ADR-0019: shared dependency versions live here, not in individual manifests.
# This is also how ADR-0010's exact-pinning requirement for `@allmaps/*` will be
# expressed once for both apps: every `@allmaps/*` entry is an EXACT version with
# no range specifier, because all of them are pre-1.0 and a bump is a migration
# event. Nothing else here is pinned exactly.
catalog:
  # Svelte and SvelteKit
  '@sveltejs/adapter-static': ^3.0.10
  '@sveltejs/kit': ^2.70.2
  '@sveltejs/vite-plugin-svelte': ^7.2.0
  svelte: ^5.56.8
  svelte-check: ^4.7.4

  # Build and test
  vite: ^8.2.0
  vitest: ^4.1.10

  # Vitest browser mode, for the ProjectStore adapters that need a real browser: there is no
  # OPFS in Node (ticket 02), and no File System Access either (ticket 12). Pinned to the same
  # minor as vitest, which @vitest/browser-playwright peers on exactly.
  '@vitest/browser-playwright': ^4.1.10
  playwright: ^1.62.1

  # IIIF. Exact, no range specifier: pre-1.0, and a bump is a migration event.
  # `@allmaps/types` is type-only. It is listed here because `@allmaps/iiif-parser`
  # re-exports `TileZoomLevel` and `ImageRequest` from it while declaring it only as a
  # devDependency, so without it those types silently degrade to `any` under
  # `skipLibCheck` — which is the opposite of what pinning these packages is for.
  '@allmaps/iiif-parser': 1.0.0-beta.48
  '@allmaps/types': 1.0.0-beta.23

  # `@allmaps/id` mints the id a locally ingested image is stored under (ticket 05).
  # `generateRandomId()` for local files; `generateId(uri)` is for remote resources.
  '@allmaps/id': 1.0.0-beta.38

  # The Alignment's file format and its transformation vocabulary (ticket 07).
  #
  # `@allmaps/annotation` reads and writes the IIIF Georeference Annotation an Alignment
  # serialises to. `@allmaps/transform` is here for two things. The first is a pair of named
  # functions: `transformationTypeToTypeAndOrder` and its inverse are the only correct
  # translation between the canonical Allmaps type name (`polynomial1`) and the `type` +
  # `options.order` pair the annotation actually carries — see `georeference-annotation.ts`,
  # which explains why writing the literal string loses it.
  #
  # The second is the **solver**, in `core`, for the fold warning (ticket 08). ADR-0013 makes that
  # warning continuous and independent of the overlay, and a warning read out of a WebGL layer's
  # triangulation exists only while a layer does, only in a browser, and only after the style has
  # loaded — which is not when a student placing their fourth point needs it. So `distortion.ts`
  # constructs a `GcpTransformer` directly. The renderer reaches the same solver for itself,
  # through `@allmaps/maplibre`; this is a second caller of one library, not a second solver.
  #
  # Both exact, no range specifier, for the reason at the top of this block: these two decide
  # whether an Alignment written today still means the same thing after a beta bump, which is
  # the migration event ADR-0010 names and the fixture round-trip in ticket 07 guards.
  '@allmaps/annotation': 1.0.0-beta.37
  '@allmaps/transform': 1.0.0-beta.52

  # The Allmaps community alignment lookup (ticket 14, ADR-0015): `fetchAnnotationsFromApi`
  # asks `annotations.allmaps.org` whether anyone has already georeferenced the resource the
  # user is adding. Exact for the reason at the top of this block, and because the *shape* of
  # what that API returns is what `@allmaps/annotation` then has to read.
  #
  # It reaches the network through the page's own `fetch` and takes no injection point, so the
  # ADR-0015 "off means no request" rule is enforced by not calling it — see
  # `packages/core/src/remote-iiif/community-alignments.ts`, which names the seam, and
  # `EditorSession.fetchCommunityAnnotations`, which is the only call site.
  #
  # A dependency of `apps/editor` and **not** of `@ballastella/core`: core names the seam and the
  # app supplies the implementation, the same shape ADR-0011 uses throughout. It pulls
  # `lodash-es`, `@turf/rewind`, and `svg-parser` behind it, and ADR-0019 is explicit that
  # tree-shaking is not a boundary — every published site ships the viewer bundle, and a reader
  # never asks Allmaps anything.
  '@allmaps/stdlib': 1.0.0-beta.41

  # triiiceratops: Manifest and Collection browsing, canvas selection, and unwarped viewing
  # (ADR-0018, ticket 14). Imported from its `./svelte` export as an ordinary Svelte component,
  # never as the web component — the OpenSeadragon `TileSource` ADR-0011 requires is natural as
  # a prop and awkward as an attribute.
  #
  # Exact, no range specifier, for the same reason as `@allmaps/*`: it is pre-1.0, we maintain
  # it, and it carries `manifesto.js` — the second IIIF parser in the bundle, whose only
  # contract with the first is the URI boundary in ADR-0018. A release that changed how a
  # canvas's image service URI is reported would move that boundary silently.
  #
  # **Both apps as of ticket 17**, because story 85 does need it: a Reader viewing a Historical Map on
  # its own, unwarped, to read it as a document. It is the one thing the editor could not do for a
  # locally ingested pyramid — triiiceratops 1.0.0-rc.35 offers no way to hand OpenSeadragon a
  # `TileSource`, and a stored pyramid has no URL (see `UnwarpedView.svelte`). On a Published Site the
  # pyramid *does* have a URL: it is static files beside `index.html`, so the same component reads it
  # over HTTP with nothing injected.
  triiiceratops: 1.0.0-rc.35

  # `@allmaps/maplibre` is the ADR-0011 injection point for warped rendering: `fetchFn` on
  # `WarpedMapLayer` is how a locally stored pyramid reaches it (ticket 06). Wired now, used in
  # anger by ticket 07. It depends on `maplibre-gl` ^5, which is the range the catalog holds —
  # two MapLibre copies in one page is a broken map rather than a warning.
  #
  # A dependency of `@ballastella/core` as of ticket 17, not of either app: both draw the same warped
  # Historical Maps, and `core/src/render/` is where that stopped being two copies of the same rules.
  '@allmaps/maplibre': 1.0.0-beta.43

  # UI (ADR-0016: daisyUI is the only UI dependency)
  '@tailwindcss/vite': ^4.3.3
  daisyui: ^5.7.16
  tailwindcss: ^4.3.3

  # TypeScript. Held at ^6 rather than ^7: svelte-check and @sveltejs/kit peer on
  # `^5 || ^6`, and typescript-eslint on `<6.1.0`. Raise when they catch up.
  typescript: ~6.0.3

  # Map stack (ADR-0005). Both panes are MapLibre GL maps.
  #
  # maplibre-gl is held at ^5 rather than ^6, for two reasons that both matter later.
  # `@allmaps/maplibre` and `@allmaps/basemap` peer on `^5`, and two MapLibre copies in one
  # page is not a version warning but a broken map — ticket 07 needs those packages. And v6
  # moved its worker into a sibling file whose URL it computes from `import.meta.url` at
  # runtime, which no bundler can see; v5 inlines the worker and needs no `setWorkerUrl`
  # plumbing. Raise it when `@allmaps/*` does, which ADR-0010 makes a migration event anyway.
  #
  # `@maplibre/maplibre-gl-style-spec` is here rather than left to maplibre-gl's own tree
  # because `@ballastella/core` returns a `StyleSpecification` across the package boundary,
  # and two resolutions of that type is how a skew becomes a type error in an app that
  # changed nothing. Keep it on the major maplibre-gl depends on.
  '@maplibre/maplibre-gl-style-spec': ^24.8.1
  '@protomaps/basemaps': ^5.7.2
  maplibre-gl: ^5.24.0
  pmtiles: ^4.4.1

  # NOTE: `terra-draw` is deliberately **not** here, and this is now the third ticket to decline it —
  # ticket 07 for the Control Point pairing, ticket 08 for the Resource Mask, and ticket 10 for
  # Annotation drawing. ADR-0005 says all drawing goes through it, so the ADR and the code now
  # disagree; that is recorded as an open question for a human in the tracker rather than decided
  # here. The reasons are in `apps/editor/src/lib/annotations/drawing.svelte.ts`.

  # The Annotation `description` rendering pipeline (ADR-0009): `marked` parses the Markdown,
  # DOMPurify sanitises the HTML it produced, and the order is not negotiable — sanitising before
  # parsing is a known bypass shape, because a parser downstream of the sanitiser can reconstruct
  # markup out of text the sanitiser already cleared as inert.
  #
  # Both are direct dependencies of `@ballastella/core` **and of both apps**. Core is where the one
  # function that owns both stages lives, so that the order cannot be reversed by a later edit; the
  # apps declare them because ADR-0018 is explicit that `dompurify` arriving in triiiceratops' tree
  # explains why it costs nothing extra to install and is *not* permission to import it undeclared —
  # pnpm's isolated `node_modules` exists to prevent exactly that, and a transitive dependency can be
  # dropped or majored by its parent without warning.
  #
  # `marked` over `markdown-it` and `remark` on bundle size, because the renderer ships in
  # `apps/viewer` too and ADR-0019 requires that build to stay lean. The parser is not the security
  # boundary — DOMPurify is.
  dompurify: ^3.4.13
  marked: ^18.0.9

  # Zip export and import (ticket 13, ADR-0001: the only way in and out for Firefox, Safari,
  # and iPad).
  #
  # fflate rather than a browser-only library, because the round-trip tests are Seam 1 — an
  # in-memory ProjectStore in Node — and rather than a write-only one such as `client-zip`,
  # because import is half the slice. It gives an incremental `Zip` (one file in memory at a
  # time, so a mirrored pyramid of hundreds of megabytes never lands in the heap whole) and an
  # `unzip` whose `filter` reads the central directory without inflating anything, which is what
  # lets import validate the whole archive *before* writing its first byte.
  #
  # Also a devDependency of the repository root: the Playwright suite builds the fixture zips it
  # feeds to the file input, and reads back the ones the app downloads.
  fflate: ^0.8.3

patchedDependencies:
  '@allmaps/render@1.0.0-beta.83': patches/@allmaps__render@1.0.0-beta.83.patch
