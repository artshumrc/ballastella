packages:
  - packages/*
  - apps/*

# ADR-0019: shared dependency versions live here, not in individual manifests.
# This is also how ADR-0010's exact-pinning requirement for `@allmaps/*` will be
# expressed once for both apps: every `@allmaps/*` entry is an EXACT version with
# no range specifier, because all of them are pre-1.0 and a bump is a migration
# event. Nothing else here is pinned exactly.
catalog:
  # Svelte and SvelteKit
  '@sveltejs/adapter-static': ^3.0.10
  '@sveltejs/kit': ^2.70.2
  '@sveltejs/vite-plugin-svelte': ^7.2.0
  svelte: ^5.56.8
  svelte-check: ^4.7.4

  # Build and test
  vite: ^8.2.0
  vitest: ^4.1.10

  # Vitest browser mode, for the ProjectStore adapters that need a real browser: there is no
  # OPFS in Node (ticket 02), and no File System Access either (ticket 12). Pinned to the same
  # minor as vitest, which @vitest/browser-playwright peers on exactly.
  '@vitest/browser-playwright': ^4.1.10
  playwright: ^1.62.1

  # IIIF. Exact, no range specifier: pre-1.0, and a bump is a migration event.
  # `@allmaps/types` is type-only. It is listed here because `@allmaps/iiif-parser`
  # re-exports `TileZoomLevel` and `ImageRequest` from it while declaring it only as a
  # devDependency, so without it those types silently degrade to `any` under
  # `skipLibCheck` — which is the opposite of what pinning these packages is for.
  '@allmaps/iiif-parser': 1.0.0-beta.48
  '@allmaps/types': 1.0.0-beta.23

  # `@allmaps/id` mints the id a locally ingested image is stored under (ticket 05).
  # `generateRandomId()` for local files; `generateId(uri)` is for remote resources.
  '@allmaps/id': 1.0.0-beta.38

  # `@allmaps/maplibre` is the ADR-0011 injection point for warped rendering: `fetchFn` on
  # `WarpedMapLayer` is how a locally stored pyramid reaches it (ticket 06). Wired now, used in
  # anger by ticket 07. It depends on `maplibre-gl` ^5, which is the range the catalog holds —
  # two MapLibre copies in one page is a broken map rather than a warning.
  '@allmaps/maplibre': 1.0.0-beta.43

  # The streaming tiler (ADR-0003), for images above the measured `createImageBitmap` decode
  # ceiling. **Single-threaded build only**: the threaded one needs COOP/COEP cross-origin
  # isolation headers, which GitHub Pages cannot set, and that would break "anyone can fork and
  # host their own instance". It is a dependency of `apps/editor` and never of `@ballastella/core`
  # or `apps/viewer` (ADR-0019) — core takes the module through an injected loader — and it is
  # reached only by dynamic import, so it is fetched when the streaming path is taken and not
  # before. The artefact is compiled libvips, LGPL-2.1-or-later; see THIRD-PARTY-NOTICES.md.
  'wasm-vips': 0.0.18

  # UI (ADR-0016: daisyUI is the only UI dependency)
  '@tailwindcss/vite': ^4.3.3
  daisyui: ^5.7.16
  tailwindcss: ^4.3.3

  # TypeScript. Held at ^6 rather than ^7: svelte-check and @sveltejs/kit peer on
  # `^5 || ^6`, and typescript-eslint on `<6.1.0`. Raise when they catch up.
  typescript: ~6.0.3

  # Map stack (ADR-0005). Both panes are MapLibre GL maps.
  #
  # maplibre-gl is held at ^5 rather than ^6, for two reasons that both matter later.
  # `@allmaps/maplibre` and `@allmaps/basemap` peer on `^5`, and two MapLibre copies in one
  # page is not a version warning but a broken map — ticket 07 needs those packages. And v6
  # moved its worker into a sibling file whose URL it computes from `import.meta.url` at
  # runtime, which no bundler can see; v5 inlines the worker and needs no `setWorkerUrl`
  # plumbing. Raise it when `@allmaps/*` does, which ADR-0010 makes a migration event anyway.
  #
  # `@maplibre/maplibre-gl-style-spec` is here rather than left to maplibre-gl's own tree
  # because `@ballastella/core` returns a `StyleSpecification` across the package boundary,
  # and two resolutions of that type is how a skew becomes a type error in an app that
  # changed nothing. Keep it on the major maplibre-gl depends on.
  '@maplibre/maplibre-gl-style-spec': ^24.8.1
  '@protomaps/basemaps': ^5.7.2
  maplibre-gl: ^5.24.0
  pmtiles: ^4.4.1

  # Zip export and import (ticket 13, ADR-0001: the only way in and out for Firefox, Safari,
  # and iPad).
  #
  # fflate rather than a browser-only library, because the round-trip tests are Seam 1 — an
  # in-memory ProjectStore in Node — and rather than a write-only one such as `client-zip`,
  # because import is half the slice. It gives an incremental `Zip` (one file in memory at a
  # time, so a mirrored pyramid of hundreds of megabytes never lands in the heap whole) and an
  # `unzip` whose `filter` reads the central directory without inflating anything, which is what
  # lets import validate the whole archive *before* writing its first byte.
  #
  # Also a devDependency of the repository root: the Playwright suite builds the fixture zips it
  # feeds to the file input, and reads back the ones the app downloads.
  fflate: ^0.8.3

patchedDependencies:
  '@allmaps/render@1.0.0-beta.83': patches/@allmaps__render@1.0.0-beta.83.patch
