name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm check

      - run: pnpm -r build

      - name: Built output references assets relatively
        run: node scripts/check-relative-assets.mjs apps/editor/build apps/viewer/build

      - name: Jekyll is off in both builds and in what publishing writes
        run: node scripts/check-nojekyll.mjs

      # Firefox too: OPFS is the universal backend, and Firefox has its own implementation.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - run: pnpm test

      # Chromium's storage quota comes from the profile's filesystem; the runner's /tmp is too small.
      - name: Temporary-directory space (browser storage quota comes from here)
        run: df -h /tmp "${{ runner.temp }}"

      - run: pnpm exec playwright test
        env:
          TMPDIR: ${{ runner.temp }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Last: it overwrites apps/editor/build, which everything above tested.
      - run: pnpm build:deploy

      - name: The deployable artifact carries the app and no developer harness
        run: node scripts/check-deploy-artifact.mjs

      - name: Jekyll is off in the deployable artifact too
        run: node scripts/check-nojekyll.mjs
