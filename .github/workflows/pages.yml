# Deploys the editor; the viewer ships inside it as the bytes a Published Site is written from.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Fails by name when a fork's Pages source is not yet "GitHub Actions".
      - uses: actions/configure-pages@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:deploy
        # Upstream only: a fork reports nothing to this Umami instance.
        env:
          VITE_UMAMI_WEBSITE_ID: ${{ github.repository == 'artshumrc/ballastella' && 'c595dc31-6ffc-417e-8efb-c75b5426f3c7' || '' }}
          VITE_UMAMI_SCRIPT_URL: ${{ github.repository == 'artshumrc/ballastella' && 'https://stats.digitalhumanities.fas.harvard.edu/darth-stats.js' || '' }}

      - name: Built output references assets relatively
        run: node scripts/check-relative-assets.mjs apps/editor/build

      - name: Jekyll is off, here and in every site this build publishes
        run: node scripts/check-nojekyll.mjs

      - name: The artifact carries the app and no developer harness
        run: node scripts/check-deploy-artifact.mjs

      # Advisory by design (ADR-0025): it fails while the Base Map archive is borrowed. Keep the step
      # once the archive is provisioned; it then asserts that it still passes.
      - name: Deployment configuration (advisory)
        run: |
          # Annotations end at a newline, so each message stays on one line.
          if ! pnpm check:deployment; then
            echo "::warning title=Borrowed Base Map archive::This deployment's Base Map reads an archive it does not control. It works, and it rests on somebody else's bandwidth with no promise to this site. See docs/hosting.md and ADR-0025."
          fi
          # The lookup check exits 0 by design (ADR-0029), so it is asked for its marker instead.
          if node scripts/check-place-service.mjs --deployment | grep -qF '::borrowed-lookup-service::'; then
            echo "::warning title=Borrowed place lookup service::This deployment's place search asks a geocoder it does not run. The use is within that service's published policy, and it is somebody else's hardware with no promise to this site. Unlike the archive above this does not fail the check: repointing it means running a planet-scale geocoder. See docs/hosting.md and ADR-0029."
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/editor/build

      - id: deploy
        uses: actions/deploy-pages@v5
